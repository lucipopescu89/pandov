     "Chaos" share a single text run, so the whole line stays centred whatever
     width the font sets it at. -->
<text fill="#888888" style="white-space: pre" xml:space="preserve" font-family="Julius Sans One" font-size="12" letter-spacing="0em" x="602" y="515.31" text-anchor="middle">and for eternity Disipated by <tspan fill="white">Chaos</tspan></text>
<text fill="#888888" style="white-space: pre" xml:space="preserve" font-family="Julius Sans One" font-size="12" letter-spacing="0em"><tspan x="540.348" y="247.31">shatered into dust</tspan></text>
</g>

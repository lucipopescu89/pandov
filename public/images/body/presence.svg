<!-- Presence: the caption sits 532px below the Figma export, the pendant
     436px below it, each in its own group. Together they are centred inside
     the halo's innermost ring (y 697 to 1270, centred on y 983.5), with even
     room of about 40px from the ring to the caption (top y 737), from the
     caption to the pendant photo (y 825 to 1230), and from the photo back to
     the ring. The export's two ellipses are both gone from here: the inner
     circle was dropped, and PresenceHalo now owns the outer one, drawing it as
     a radiating field centred on the pendant. The "and surrender to the
     Emperor of nothingness" caption lives in emperor.svg, over its pendant. -->
